<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냉장고 파먹기 AI 요리사</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; background-color: #f9f9f9; }
    h1 { color: #333; }
    input[type="text"] { width: 80%; padding: 12px; font-size: 16px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; }
    input[type="file"] { margin-bottom: 15px; }
    button { padding: 12px 24px; font-size: 16px; background-color: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background-color: #ee5253; }
    #result { margin-top: 30px; text-align: left; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); white-space: pre-wrap; line-height: 1.6; }
    .input-group { margin-bottom: 15px; }
  </style>
</head>
<body>

  <h1>🍳 냉장고 파먹기 AI</h1>
  <p>재료 이름을 직접 적거나, 냉장고 속 사진을 올려보세요!</p>
  
  <div class="input-group">
    <input type="text" id="ingredients" placeholder="예: 계란, 대파, 스팸 (선택사항)">
  </div>

  <div class="input-group">
    <label for="imageInput">📸 재료/냉장고 사진 첨부: </label><br><br>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <button onclick="getRecipe()">레시피 추천받기</button>

  <div id="result">여기에 AI 추천 레시피가 등장합니다!</div>

  <script>
    // ⚠️ 아래에 본인의 OpenAI API 키를 붙여넣으세요!
    const API_KEY = "여기에_발급받은_OPENAI_API_키를_붙여넣으세요";

    // 이미지를 API로 보낼 수 있는 텍스트(Base64)로 변환해 주는 함수
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function getRecipe() {
      const textInput = document.getElementById('ingredients').value;
      const fileInput = document.getElementById('imageInput');
      const resultDiv = document.getElementById('result');

      const file = fileInput.files[0];

      // 텍스트도 없고 파일도 안 올렸을 때 방어
      if (!textInput && !file) {
        alert('재료 이름을 적거나 사진을 첨부해 주세요!');
        return;
      }

      if (API_KEY.includes("여기에")) {
        alert('API 키를 먼저 자바스크립트 코드에 입력해 주세요!');
        return;
      }

      resultDiv.innerText = '👨‍🍳 AI 요리사가 사진과 재료를 분석해서 레시피를 구상 중입니다...';

      // OpenAI 메시지 내용 구성
      const userContent = [];

      // 1. 텍스트 정보가 있으면 추가
      if (textInput) {
        userContent.push({
          type: "text",
          text: `냉장고에 있는 재료: ${textInput}`
        });
      }

      // 2. 사진 파일이 있으면 Base64로 변환해서 추가
      if (file) {
        try {
          const base64Image = await fileToBase64(file);
          userContent.push({
            type: "image_url",
            image_url: {
              url: base64Image
            }
          });
          userContent.push({
            type: "text",
            text: "첨부된 사진 속 재료들도 함께 인식해서 사용할 수 있는 최고의 요리를 추천해 주세요."
          });
        } catch (e) {
          alert('이미지를 읽는 중 오류가 발생했습니다.');
          return;
        }
      }

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              {
                role: 'system',
                content: '당신은 한국 자취생과 가정집을 위한 친절한 백종원 스타일의 요리사입니다. 제공된 재료 텍스트와 사진 속에 찍힌 재료들을 인식하여 한국인 입맛에 딱 맞는 간단하고 맛있는 레시피 1가지를 추천해 주세요. 요리 이름, 필요한 추가 기본 양념(간장, 식용유 등), 조리 순서를 보기 쉽게 정리해서 안내해 주세요.'
              },
              {
                role: 'user',
                content: userContent
              }
            ]
          })
        });

        const data = await response.json();
        
        if (data.choices && data.choices.length > 0) {
          resultDiv.innerText = data.choices[0].message.content;
        } else {
          resultDiv.innerText = '오류가 발생했습니다: ' + (data.error ? data.error.message : '알 수 없는 오류');
        }
      } catch (error) {
        resultDiv.innerText = '통신 중 오류가 발생했습니다: ' + error.message;
      }
    }
  </script>
</body>
</html>
